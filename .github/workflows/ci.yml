name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/*/package-lock.json
      # npm ci, not install: fails when a lockfile is out of date, as the deploy would
      - run: npm ci && npm ci --prefix apps/backend && npm ci --prefix apps/web
        env:
          HUSKY: 0
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            apps/backend/coverage
            apps/web/coverage

  # After the checks pass on main: build, upload a release over SSH, and switch the server to it.
  # Settings live in the production environment, as variables or secrets (see Deploying in README.md).
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # One deploy at a time, and never cancelled halfway
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      HOST: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
      PORT: ${{ vars.DEPLOY_PORT || secrets.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER }}
      APP_DIR: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH }}
    steps:
      - name: Check the deploy settings
        env:
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          for name in HOST DEPLOY_USER APP_DIR API_URL SSH_KEY KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing deploy settings:$missing (see Deploying in README.md)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/*/package-lock.json
      - run: npm ci --prefix apps/backend && npm ci --prefix apps/web
        env:
          HUSKY: 0
      - run: npm run build --prefix apps/backend
      # The API's address is built into the browser code
      - run: npm run build --prefix apps/web
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL }}
      - name: Assemble the release
        run: |
          mkdir -p release/backend release/web
          cp -r apps/backend/dist apps/backend/migrations apps/backend/data apps/backend/package.json \
            apps/backend/package-lock.json release/backend/
          cp -r apps/web/.next/standalone/. release/web/
          cp -r apps/web/.next/static release/web/.next/static
          cp -r apps/web/public release/web/public
          cp -r deploy release/deploy
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload the release
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -p $PORT" \
            release/ "$DEPLOY_USER@$HOST:$APP_DIR/releases/$GITHUB_SHA/"
      - name: Switch the server to it
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$DEPLOY_USER@$HOST" \
            "bash '$APP_DIR/releases/$GITHUB_SHA/deploy/remote-deploy.sh' '$APP_DIR' '$GITHUB_SHA'"
      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
