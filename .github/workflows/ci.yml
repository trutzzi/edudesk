name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/*/package-lock.json
      # npm ci, not install: fails when a lockfile is out of date, as the deploy would
      - run: npm ci && npm ci --prefix apps/backend && npm ci --prefix apps/web
        env:
          HUSKY: 0
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            apps/backend/coverage
            apps/web/coverage

  # After the checks pass on main: build the Docker images, upload them over SSH, and restart the
  # server's containers on them.
  # Settings live in the production environment, as variables or secrets (see Deploying in README.md).
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # One deploy at a time, and never cancelled halfway
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      HOST: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
      PORT: ${{ vars.DEPLOY_PORT || secrets.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER }}
      APP_DIR: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH }}
    steps:
      - name: Check the deploy settings
        env:
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          for name in HOST DEPLOY_USER APP_DIR API_URL SSH_KEY KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing deploy settings:$missing (see Deploying in README.md)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Build the images
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL }}
        run: |
          docker build -t "edudesk-api:$GITHUB_SHA" apps/backend
          docker build -t "edudesk-web:$GITHUB_SHA" --build-arg NEXT_PUBLIC_API_URL apps/web
      - name: Assemble the release
        run: |
          mkdir release
          docker save "edudesk-api:$GITHUB_SHA" "edudesk-web:$GITHUB_SHA" | gzip > release/images.tar.gz
          cp deploy/docker-compose.yml deploy/remote-deploy.sh release/
          ls -lh release
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload the release
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$DEPLOY_USER@$HOST" "mkdir -p '$APP_DIR/releases/$GITHUB_SHA'"
          scp -i ~/.ssh/deploy_key -P "$PORT" release/* "$DEPLOY_USER@$HOST:$APP_DIR/releases/$GITHUB_SHA/"
      - name: Switch the server to it
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$DEPLOY_USER@$HOST" \
            "bash '$APP_DIR/releases/$GITHUB_SHA/remote-deploy.sh' '$APP_DIR' '$GITHUB_SHA'"
      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
